<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoSub — Subscribe</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.card { background: #111; border: 1px solid #ff4500; border-radius: 16px; padding: 48px; width: 100%; max-width: 420px; text-align: center; }
.logo { font-size: 22px; font-weight: 700; color: #ff4500; margin-bottom: 32px; }
h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
p { color: #999; font-size: 14px; margin-bottom: 32px; line-height: 1.6; }
.price { font-size: 52px; font-weight: 800; margin-bottom: 8px; }
.price span { font-size: 18px; color: #999; }
ul { list-style: none; text-align: left; margin-bottom: 32px; }
ul li { padding: 10px 0; color: #ccc; font-size: 14px; border-bottom: 1px solid #1a1a1a; }
ul li::before { content: "✓ "; color: #ff4500; font-weight: 700; }
.btn { display: block; width: 100%; background: #ff4500; color: #fff; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn:hover { background: #e03d00; }
.skip { margin-top: 16px; font-size: 13px; color: #555; }
.skip a { color: #999; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">AutoSub</div>
  <h1>Activate your bot</h1>
  <div class="price">$97<span>/month</span></div>
  <p>Your bot is configured and ready. Subscribe to start sending DMs automatically.</p>
  <ul>
    <li>200+ targeted DMs per day</li>
    <li>Global Reddit search 24/7</li>
    <li>Live dashboard and reply tracking</li>
    <li>Cancel anytime</li>
  </ul>
  <form action="/create-checkout" method="POST">
    <button type="submit" class="btn">Start sending DMs</button>
  </form>
  <div class="skip"><a href="/setup">Edit settings first</a></div>
</div>
</body>
</html>
